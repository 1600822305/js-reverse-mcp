// ==================== Messages ====================

message Metadata {
  string ide_name = 1;
  string ide_version = 2;
  string extension_name = 3;
  string extension_version = 4;
  string api_key = 5;
  string locale = 6;
  string session_id = 7;
  string request_id = 8;
  string user_agent = 9;
  string url = 10;
}

message GitRepoInfo {
  string name = 1;
  string owner = 2;
  string commit = 3;
  string pr_url = 4;
}

message CodeContextItem {
  // 代码上下文项
}

message CompletionsRequest {
  // 补全请求
}

message CompletionByDateEntry {
  // 按日期的补全统计
}

message CompletionByLanguageEntry {
  // 按语言的补全统计
}

message CompletionStatistics {
  // 补全统计
}
